[general]
base_ref = "main"

[diff]
max_bytes = 250000
exclude = [
  "*.lock",
  "*-lock.json",
  "vendor/**",
  "**/*.min.js",
  "**/*.min.css",
  "**/__snapshots__/**",
  "**/*.pb.go",
  "**/*_pb2.py",
  "docs/runs/**",
  "docs/results/data/**",
  "docs/results/portfolio-v2-evidence/**",
]

[commands]
test = "uv run --python 3.11 --no-project python -m unittest --verbose"
lint = "uvx ruff@0.14.2 check . && uvx mypy@1.14.1"
