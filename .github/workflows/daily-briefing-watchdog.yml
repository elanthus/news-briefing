name: Daily briefing watchdog

# GitHub can create a scheduled Daily briefing run and never start its job, so
# no step of that workflow runs to notice. This workflow checks the deployed
# metrics ledger every hour and, while the date can still be recovered,
# dispatches a manual single-day run. See briefing_watchdog.py for the rules.
# It runs hourly because scheduled starts here have been hours late; any one
# check that fires in the evening Eastern window is enough.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the decision without cancelling, dispatching, or opening an issue
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: daily-briefing-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Check for a missed daily briefing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check and recover today's briefing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # DRY_RUN is unquoted on purpose: an empty value must add no argument.
        run: python3 -S briefing_watchdog.py $DRY_RUN
