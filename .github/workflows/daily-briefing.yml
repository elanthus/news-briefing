name: Daily briefing

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-briefing-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy gated briefing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Fetch current corpus
        id: fetch
        continue-on-error: true
        run: python fetch_news.py --hours 24 -o corpus.json

      - name: Generate publication candidate
        id: briefing
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python run_briefing.py \
            --provider openrouter \
            --model deepseek/deepseek-v4-flash-20260423 \
            --corpus corpus.json \
            --run-dir run \
            --output current.md \
            --max-corrections 1 \
            --max-tokens 20000 \
            --reasoning disabled

      - name: Apply publication gate
        if: always()
        run: python prepare_publication.py

      - name: Bootstrap history from dogfood runs
        if: always()
        run: python bootstrap_history.py briefing-bootstrap

      - name: Download prior live history
        if: always()
        continue-on-error: true
        run: |
          curl \
            --fail \
            --location \
            --max-time 30 \
            --max-filesize 50000000 \
            --remove-on-error \
            --silent \
            --show-error \
            https://elanthus.github.io/news-briefing/history.json \
            --output prior-history.json

      - name: Build static archive
        if: always()
        run: |
          if [[ -f prior-history.json ]]; then
            python build_site.py briefing-history site \
              --bootstrap-dir briefing-bootstrap \
              --prior-history prior-history.json
          else
            python build_site.py briefing-history site --bootstrap-dir briefing-bootstrap
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
