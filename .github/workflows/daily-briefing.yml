name: Daily briefing

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Report range to regenerate and replace
        required: true
        default: single-day
        type: choice
        options:
          - single-day
          - backfill-7-days
      report_date:
        description: Optional YYYY-MM-DD to replace in single-day mode (blank means today)
        required: false
        type: string
      allow_empty_history:
        description: Deploy even if the prior published history could not be downloaded
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-briefing-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy gated briefing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install site renderer dependency
        run: python -m pip install --requirement requirements-site.txt

      - name: Capture briefing window
        run: |
          mkdir -p briefing-history corpora reports runs
          snapshot_end_epoch=$(date --utc +%s)
          window_start_epoch=$((snapshot_end_epoch - 86400))
          window_start=$(date --utc --date="@$window_start_epoch" --iso-8601=seconds)
          window_end=$(date --utc --date="@$snapshot_end_epoch" --iso-8601=seconds)
          today=$(TZ=America/New_York date --date="@$snapshot_end_epoch" +%F)
          echo "SNAPSHOT_END_EPOCH=$snapshot_end_epoch" >> "$GITHUB_ENV"
          echo "WINDOW_START=$window_start" >> "$GITHUB_ENV"
          echo "WINDOW_END=$window_end" >> "$GITHUB_ENV"
          echo "REPORT_TODAY=$today" >> "$GITHUB_ENV"

      - name: Restore private corpus window
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORPUS_ARCHIVE_PASSPHRASE: ${{ secrets.CORPUS_ARCHIVE_PASSPHRASE }}
        run: |
          today="$REPORT_TODAY"

          download_public_file() {
            local url="$1"
            local output="$2"
            local status
            if ! status=$(curl \
              --location \
              --max-time 30 \
              --max-filesize 50000000 \
              --remove-on-error \
              --silent \
              --show-error \
              --write-out "%{http_code}" \
              "$url" \
              --output "$output"); then
              echo "::error::Could not download $url"
              return 2
            fi
            if [[ "$status" == "200" ]]; then
              return 0
            fi
            if [[ "$status" == "404" ]]; then
              return 1
            fi
            echo "::error::Unexpected HTTP $status from $url"
            return 2
          }

          set +e
          python restore_private_corpora.py --output-dir corpora
          restore_status=$?
          set -e
          if (( restore_status == 4 )); then
            marker_status=0
            download_public_file \
              https://elanthus.github.io/news-briefing/corpus-storage.json \
              published-corpus-storage.json || marker_status=$?
            if (( marker_status == 0 )); then
              python corpus_storage.py validate published-corpus-storage.json
              echo "No unexpired private archive remains; starting a fresh corpus window"
            elif (( marker_status == 2 )); then
              exit 1
            else
              history_status=0
              download_public_file \
                https://elanthus.github.io/news-briefing/history.json \
                existing-history.json || history_status=$?
              if (( history_status == 0 )); then
                echo "No private corpus archive exists yet; migrating all retained corpora from Pages"
                mkdir -p legacy-corpora
                downloaded=0
                for days_ago in $(seq 1 13); do
                  d=$(TZ=America/New_York date --date="$today $days_ago days ago" +%F)
                  if download_public_file \
                    "https://elanthus.github.io/news-briefing/corpora/$d.json" \
                    "legacy-corpora/$d.json"; then
                    downloaded=$((downloaded + 1))
                  fi
                done
                if (( downloaded != 13 )); then
                  echo "::error::Downloaded only $downloaded of 13 retained public corpora; leaving Pages unchanged for a complete retry"
                  exit 1
                fi
                python private_archive.py prune-corpora legacy-corpora --newest "$today"
                cp legacy-corpora/*.json corpora/
              elif (( history_status == 1 )); then
                echo "No published history exists; starting the first corpus window"
              else
                exit 1
              fi
            fi
          elif (( restore_status != 0 )); then
            echo "::error::Private corpus restoration failed"
            exit "$restore_status"
          fi
          python private_archive.py prune-corpora corpora --newest "$today"

      - name: Generate scheduled daily or manual backfill reports
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_REPORT_DATE: ${{ inputs.report_date }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          today="$REPORT_TODAY"
          window_start="$WINDOW_START"
          window_end="$WINDOW_END"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_MODE" == "single-day" && -n "$MANUAL_REPORT_DATE" ]]; then
            if [[ ! "$MANUAL_REPORT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
              [[ "$(date --utc --date="$MANUAL_REPORT_DATE" +%F 2>/dev/null)" != "$MANUAL_REPORT_DATE" ]]; then
              echo "::error::report_date must be a real calendar date in YYYY-MM-DD form"
              exit 1
            fi
            oldest=$(TZ=America/New_York date --date="$today 13 days ago" +%F)
            if [[ "$MANUAL_REPORT_DATE" < "$oldest" || "$MANUAL_REPORT_DATE" > "$today" ]]; then
              echo "::error::report_date must be inside the retained private corpus window ($oldest through $today)"
              exit 1
            fi
            report_dates=("$MANUAL_REPORT_DATE")
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_MODE" == "backfill-7-days" ]]; then
            report_dates=()
            for days_ago in 6 5 4 3 2 1 0; do
              report_dates+=("$(TZ=America/New_York date --date="$today $days_ago days ago" +%F)")
            done
          else
            report_dates=("$today")
          fi
          for report_date in "${report_dates[@]}"; do
            corpus="corpora/$report_date.json"
            run_dir="runs/$report_date"
            report="reports/$report_date.md"

            corpus_ready=false
            if [[ "$report_date" == "$today" ]]; then
              if python fetch_news.py \
                --window-start "$window_start" \
                --window-end "$window_end" \
                --report-date "$report_date" \
                --output "$corpus"; then
                corpus_ready=true
              else
                echo "::warning::Corpus fetch failed for $report_date"
              fi
            elif [[ -f "$corpus" ]]; then
              echo "Reusing privately restored corpus for $report_date"
              corpus_ready=true
            else
              echo "::warning::Skipping $report_date: no private stored corpus is available"
              continue
            fi

            if [[ "$corpus_ready" == true ]]; then
              if ! python run_daily_briefing.py \
                --corpus "$corpus" \
                --run-dir "$run_dir" \
                --output "$report" \
                --force \
                --max-corrections 3 \
                --max-tokens 100000; then
                echo "::warning::All briefing models failed for $report_date; see $run_dir/fallback.log"
              fi
            else
              echo "::warning::Skipping briefing generation for $report_date: no corpus is available"
            fi

            if ! python prepare_publication.py \
              --run-dir "$run_dir" \
              --corpus "$corpus" \
              --history-dir briefing-history \
              --date "$report_date"; then
              echo "::warning::Publication preparation failed for $report_date"
            fi
          done

      - name: Bootstrap history from dogfood runs
        id: bootstrap
        if: always()
        continue-on-error: true
        run: python bootstrap_history.py briefing-bootstrap

      - name: Download prior live history
        if: always()
        continue-on-error: true
        # Retry a transient Pages/CDN failure: a missing prior-history.json fails
        # the deploy (build_site requires it), which would throw away this run's
        # already-paid fetch and model spend over one blip.
        run: |
          curl \
            --fail \
            --location \
            --max-time 30 \
            --max-filesize 50000000 \
            --retry 3 \
            --retry-connrefused \
            --remove-on-error \
            --silent \
            --show-error \
            https://elanthus.github.io/news-briefing/history.json \
            --output prior-history.json

      - name: Build static archive
        if: always()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ALLOW_EMPTY_HISTORY: ${{ inputs.allow_empty_history }}
        run: |
          args=(briefing-history site)
          if [[ "$BOOTSTRAP_OUTCOME" == "success" ]]; then
            args+=(--bootstrap-dir briefing-bootstrap)
          fi
          if [[ -f prior-history.json ]]; then
            args+=(--prior-history prior-history.json)
          elif [[ "$ALLOW_EMPTY_HISTORY" == "true" ]]; then
            args+=(--allow-empty-history)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--replace-existing)
          fi
          args+=(--exclude-date 2026-08-15)
          args+=(--exclude-date 2026-08-16)
          args+=(--corpora-dir corpora)
          python build_site.py "${args[@]}"

      - name: Encrypt retained corpora and diagnostics
        if: always()
        env:
          CORPUS_ARCHIVE_PASSPHRASE: ${{ secrets.CORPUS_ARCHIVE_PASSPHRASE }}
        run: |
          mkdir -p corpora reports runs private-artifacts
          if compgen -G "corpora/*.json" > /dev/null; then
            python private_archive.py create \
              --output private-artifacts/corpus-archive.tar.gz.enc \
              corpora
          else
            echo "::warning::No exact corpus exists to archive"
          fi
          python private_archive.py create \
            --output private-artifacts/briefing-diagnostics.tar.gz.enc \
            corpora reports runs

      - name: Upload private corpus archive
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briefing-corpus-archive
          path: private-artifacts/corpus-archive.tar.gz.enc
          if-no-files-found: warn
          retention-days: 14

      - name: Upload encrypted briefing diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briefing-diagnostics-${{ github.run_id }}
          path: private-artifacts/briefing-diagnostics.tar.gz.enc
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
