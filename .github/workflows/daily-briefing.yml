name: Daily briefing

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-briefing-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy gated briefing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install site renderer dependency
        run: python -m pip install --requirement requirements-site.txt

      - name: Backfill seven Eastern report dates
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p briefing-history corpora reports runs
          anchor_date=$(TZ=America/New_York date +%F)
          for days_ago in 6 5 4 3 2 1 0; do
            report_date=$(TZ=America/New_York date \
              --date="$anchor_date $days_ago days ago" +%F)
            window_start=$(TZ=America/New_York date \
              --date="$report_date 00:00:00" \
              --iso-8601=seconds)
            next_date=$(TZ=America/New_York date \
              --date="$report_date 1 day" +%F)
            window_end=$(TZ=America/New_York date \
              --date="$next_date 00:00:00" \
              --iso-8601=seconds)
            corpus="corpora/$report_date.json"
            run_dir="runs/$report_date"
            report="reports/$report_date.md"

            if python fetch_news.py \
              --window-start "$window_start" \
              --window-end "$window_end" \
              --report-date "$report_date" \
              --output "$corpus"; then
              if ! python run_briefing.py \
                --provider openrouter \
                --model deepseek/deepseek-v4-flash-20260423 \
                --corpus "$corpus" \
                --run-dir "$run_dir" \
                --output "$report" \
                --force \
                --max-corrections 3 \
                --max-tokens 20000 \
                --reasoning disabled; then
                echo "::warning::Briefing generation did not produce a ready report for $report_date"
              fi
            else
              echo "::warning::Corpus fetch failed for $report_date"
            fi

            if ! python prepare_publication.py \
              --run-dir "$run_dir" \
              --corpus "$corpus" \
              --history-dir briefing-history \
              --date "$report_date"; then
              echo "::warning::Publication preparation failed for $report_date"
            fi
          done

      - name: Bootstrap history from dogfood runs
        id: bootstrap
        if: always()
        continue-on-error: true
        run: python bootstrap_history.py briefing-bootstrap

      - name: Download prior live history
        if: always()
        continue-on-error: true
        run: |
          curl \
            --fail \
            --location \
            --max-time 30 \
            --max-filesize 50000000 \
            --remove-on-error \
            --silent \
            --show-error \
            https://elanthus.github.io/news-briefing/history.json \
            --output prior-history.json

      - name: Build static archive
        if: always()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          args=(briefing-history site)
          if [[ "$BOOTSTRAP_OUTCOME" == "success" ]]; then
            args+=(--bootstrap-dir briefing-bootstrap)
          fi
          if [[ -f prior-history.json ]]; then
            args+=(--prior-history prior-history.json)
          fi
          args+=(--replace-existing)
          python build_site.py "${args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
