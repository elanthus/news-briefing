name: Daily briefing

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Report range to regenerate and replace
        required: true
        default: single-day
        type: choice
        options:
          - single-day
          - backfill-7-days

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-briefing-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and deploy gated briefing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install site renderer dependency
        run: python -m pip install --requirement requirements-site.txt

      - name: Generate scheduled daily or manual backfill reports
        env:
          MANUAL_MODE: ${{ inputs.mode }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p briefing-history corpora reports runs
          snapshot_end_epoch=$(date --utc +%s)
          window_start_epoch=$((snapshot_end_epoch - 86400))
          window_start=$(date --utc --date="@$window_start_epoch" --iso-8601=seconds)
          window_end=$(date --utc --date="@$snapshot_end_epoch" --iso-8601=seconds)
          today=$(TZ=America/New_York date --date="@$snapshot_end_epoch" +%F)
          echo "REPORT_TODAY=$today" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_MODE" == "backfill-7-days" ]]; then
            day_offsets=(6 5 4 3 2 1 0)
          else
            day_offsets=(0)
          fi
          for days_ago in "${day_offsets[@]}"; do
            report_date=$(TZ=America/New_York date \
              --date="$today $days_ago days ago" +%F)
            corpus="corpora/$report_date.json"
            run_dir="runs/$report_date"
            report="reports/$report_date.md"

            if (( days_ago == 0 )); then
              if ! python fetch_news.py \
                --window-start "$window_start" \
                --window-end "$window_end" \
                --report-date "$report_date" \
                --output "$corpus"; then
                echo "::warning::Corpus fetch failed for $report_date"
              fi
            elif curl \
              --fail \
              --location \
              --max-time 30 \
              --max-filesize 50000000 \
              --remove-on-error \
              --silent \
              --show-error \
              "https://elanthus.github.io/news-briefing/corpora/$report_date.json" \
              --output "$corpus"; then
              echo "Reusing stored corpus for $report_date"
            else
              echo "::warning::Skipping $report_date: no stored corpus is available"
              continue
            fi

            if [[ -f "$corpus" ]]; then
              if ! python run_daily_briefing.py \
                --corpus "$corpus" \
                --run-dir "$run_dir" \
                --output "$report" \
                --force \
                --max-corrections 3 \
                --max-tokens 20000; then
                echo "::warning::All briefing models failed for $report_date; see $run_dir/fallback.log"
              fi
            fi

            if ! python prepare_publication.py \
              --run-dir "$run_dir" \
              --corpus "$corpus" \
              --history-dir briefing-history \
              --date "$report_date"; then
              echo "::warning::Publication preparation failed for $report_date"
            fi
          done

      - name: Upload briefing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briefing-diagnostics-${{ github.run_id }}
          path: |
            corpora
            reports
            runs
          if-no-files-found: warn
          retention-days: 7

      - name: Bootstrap history from dogfood runs
        id: bootstrap
        if: always()
        continue-on-error: true
        run: python bootstrap_history.py briefing-bootstrap

      - name: Download prior live history
        if: always()
        continue-on-error: true
        run: |
          curl \
            --fail \
            --location \
            --max-time 30 \
            --max-filesize 50000000 \
            --remove-on-error \
            --silent \
            --show-error \
            https://elanthus.github.io/news-briefing/history.json \
            --output prior-history.json

      - name: Carry forward stored corpora
        if: always()
        run: |
          mkdir -p corpora
          for days_ago in $(seq 1 13); do
            d=$(TZ=America/New_York date \
              --date="$REPORT_TODAY $days_ago days ago" +%F)
            [[ -f "corpora/$d.json" ]] && continue
            curl \
              --fail \
              --location \
              --max-time 30 \
              --max-filesize 50000000 \
              --remove-on-error \
              --silent \
              --show-error \
              "https://elanthus.github.io/news-briefing/corpora/$d.json" \
              --output "corpora/$d.json" || true
          done

      - name: Build static archive
        if: always()
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          args=(briefing-history site)
          if [[ "$BOOTSTRAP_OUTCOME" == "success" ]]; then
            args+=(--bootstrap-dir briefing-bootstrap)
          fi
          if [[ -f prior-history.json ]]; then
            args+=(--prior-history prior-history.json)
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--replace-existing)
          fi
          args+=(--exclude-date 2026-08-15)
          args+=(--exclude-date 2026-08-16)
          args+=(--corpora-dir corpora)
          python build_site.py "${args[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
