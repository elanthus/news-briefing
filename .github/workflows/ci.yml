name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # The project is stdlib-only by design, so there is nothing to install.
      # The suite is offline: no network calls, no fixtures fetched at runtime.
      - name: Run tests
        run: python -m unittest --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Lint
        run: uvx ruff@0.14.2 check .
      - name: Type check
        run: uvx mypy@1.14.1

  smoke:
    name: end-to-end (live sources)
    runs-on: ubuntu-latest
    # Hits real feeds, so it can fail for reasons unrelated to the change.
    # Informational only — it must never block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch a corpus
        run: python fetch_news.py --hours 24 -o corpus.json
      - name: Assert the corpus is usable
        run: |
          python - <<'PY'
          import json, sys
          corpus = json.load(open("corpus.json"))
          total = sum(len(v) for v in corpus["categories"].values())
          print(f"{total} items, {len(corpus['errors'])} fetch error(s)")
          for source in corpus["errors"]:
              print(f"  degraded: {source}")
          # Every source failing at once means the fetcher is broken, not that
          # the news is slow. A partial failure is normal and is reported.
          if total == 0:
              sys.exit("no items fetched from any source")
          PY
