name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The project is stdlib-only by design, so there is nothing to install.
      # The suite is offline: no network calls, no fixtures fetched at runtime.
      - name: Run tests
        run: |
          python -m unittest --verbose
          python -m unittest discover -s evaluator/tests --verbose

  offline-policy:
    name: offline reliability policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run the credential-free checker gate
        run: python -m evaluator checker
      - name: Enforce declared case counts and history reference
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          policy = json.loads(Path("evaluator/regression-policy.json").read_text())
          gate = policy["offline_ci_gate"]
          if gate["credentials_required"] is not False:
              raise SystemExit("offline_ci_gate must remain credential-free")
          if gate["command"] not in {"python -m evaluator checker", "python3 -m evaluator checker"}:
              raise SystemExit("offline_ci_gate command does not match the enforced checker command")
          snapshot_path = Path(gate["approved_snapshot"])
          if not snapshot_path.is_file():
              raise SystemExit(f"offline checker snapshot is missing: {snapshot_path}")
          if gate.get("snapshot_updates_require_review_approval") is not True:
              raise SystemExit("offline checker snapshot updates must require review approval")

          suite = json.loads(Path("evaluator/fixtures/checker-cases.json").read_text())
          counts = Counter(case["component"] for case in suite["cases"])
          actual = {
              "expected_case_count": len(suite["cases"]),
              "expected_checker_cases": counts["checker"],
              "expected_feed_parser_cases": counts["feed_parser"],
          }
          expected = {name: gate[name] for name in actual}
          if actual != expected:
              raise SystemExit(f"offline_ci_gate count drift: expected {expected}, got {actual}")

          history_path = Path(policy["history"])
          history = json.loads(history_path.read_text())
          if history.get("history_id") != "portfolio-v1" or not history.get("runs"):
              raise SystemExit(f"invalid or empty reliability history: {history_path}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lint
        run: uvx ruff@0.14.2 check .
      - name: Type check
        run: |
          uvx mypy@1.14.1
          uvx mypy@1.14.1 --config-file evaluator/pyproject.toml evaluator

  smoke:
    name: end-to-end (live sources)
    runs-on: ubuntu-latest
    # Hits real feeds, so it can fail for reasons unrelated to the change.
    # Informational only — it must never block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch a corpus
        run: python fetch_news.py --hours 24 -o corpus.json
      - name: Assert the corpus is usable
        run: |
          python - <<'PY'
          import json, sys
          corpus = json.load(open("corpus.json"))
          total = sum(len(v) for v in corpus["categories"].values())
          print(f"{total} items, {len(corpus['errors'])} fetch error(s)")
          for source in corpus["errors"]:
              print(f"  degraded: {source}")
          # Every source failing at once means the fetcher is broken, not that
          # the news is slow. A partial failure is normal and is reported.
          if total == 0:
              sys.exit("no items fetched from any source")
          PY
