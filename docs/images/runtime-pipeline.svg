<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Selection, frozen evidence, prose, and publication</title>
<desc id="desc">Code validates selected evidence before prose. Semantic review, isolated confirmation and bounded repair follow the candidate gate. Only accepted repairs replace the original ready artifact. Deployment receipts bind publication to exact artifacts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:650}.detail{font-size:13px;fill:#475569}.code{fill:#ecfdf5;stroke:#059669}.model{fill:#eef2ff;stroke:#6366f1}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="420" rx="16" fill="#f8fafc"/>
<text class="title" x="30" y="42">Code constrains the evidence. Models make editorial judgments.</text>
<rect class="code" x="30" y="90" width="200" height="80" rx="10"/>
<text class="label" x="130" y="122" text-anchor="middle">Fetch + project</text><text class="detail" x="130" y="146" text-anchor="middle">Bounded untrusted corpus</text>
<path class="arrow" d="M230 130 H260"/>
<rect class="model" x="265" y="90" width="200" height="80" rx="10"/>
<text class="label" x="365" y="122" text-anchor="middle">Selection</text><text class="detail" x="365" y="146" text-anchor="middle">Model chooses handles</text>
<path class="arrow" d="M465 130 H495"/>
<rect class="code" x="500" y="90" width="200" height="80" rx="10"/>
<text class="label" x="600" y="122" text-anchor="middle">Validate + freeze</text><text class="detail" x="600" y="146" text-anchor="middle">Position-scoped evidence</text>
<path class="arrow" d="M700 130 H730"/>
<rect class="model" x="735" y="90" width="200" height="80" rx="10"/>
<text class="label" x="835" y="122" text-anchor="middle">Prose</text><text class="detail" x="835" y="146" text-anchor="middle">Model writes from excerpts</text>
<path class="arrow" d="M935 130 H965"/>
<rect class="code" x="970" y="90" width="200" height="80" rx="10"/>
<text class="label" x="1070" y="122" text-anchor="middle">Candidate gate</text><text class="detail" x="1070" y="146" text-anchor="middle">Validate, repair, correct</text>
<rect class="model" x="30" y="250" width="200" height="80" rx="10"/>
<text class="label" x="130" y="282" text-anchor="middle">Semantic review</text><text class="detail" x="130" y="306" text-anchor="middle">Excerpt-level judgments</text>
<path class="arrow" d="M230 290 H260"/>
<rect class="model" x="265" y="250" width="200" height="80" rx="10"/>
<text class="label" x="365" y="282" text-anchor="middle">Confirm flags</text><text class="detail" x="365" y="306" text-anchor="middle">Isolated model checks</text>
<path class="arrow" d="M465 290 H495"/>
<rect class="model" x="500" y="250" width="200" height="80" rx="10"/>
<text class="label" x="600" y="282" text-anchor="middle">Bounded repair</text><text class="detail" x="600" y="306" text-anchor="middle">Code edits + model prose</text>
<path class="arrow" d="M700 290 H730"/>
<rect class="code" x="735" y="250" width="200" height="80" rx="10"/>
<text class="label" x="835" y="282" text-anchor="middle">Follow-up</text><text class="detail" x="835" y="306" text-anchor="middle">Validate and review repairs</text>
<path class="arrow" d="M935 290 H965"/>
<rect class="code" x="970" y="250" width="200" height="80" rx="10"/>
<text class="label" x="1070" y="282" text-anchor="middle">Publish + receipt</text><text class="detail" x="1070" y="306" text-anchor="middle">Accepted repair or original</text>
<path class="arrow" d="M1070 170 V205 H130 V245"/>
<text class="detail" x="30" y="374">Green: deterministic code · Indigo: model judgment · Failed or incomplete repairs retain the original ready briefing.</text>
<text class="detail" x="30" y="398">Frozen excerpts support review; they do not establish full-article factual accuracy or human verification.</text>
</svg>
