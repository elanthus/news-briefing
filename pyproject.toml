[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-briefing"
version = "0.1.0"
description = "Deterministic news corpus fetcher and briefing contract checker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.14.1",
    "ruff==0.14.2",
]

# uv installs the dev group by default, enabling `uv run ruff check .` and
# `uv run mypy` without globally installed tools. The optional extra above
# provides the equivalent `pip install -e '.[dev]'` workflow.
[dependency-groups]
dev = [
    "mypy==1.14.1",
    "ruff==0.14.2",
]

[tool.setuptools]
py-modules = ["corpus_schema", "eval_briefing", "fetch_news"]

[tool.mypy]
python_version = "3.11"
# The three modules that make up the pipeline are fully annotated and checked.
# The test modules are not: annotating assertions adds noise without catching
# anything the tests themselves wouldn't.
files = ["fetch_news.py", "eval_briefing.py", "corpus_schema.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — unused imports and names
    "W",   # pycodestyle warnings
    "B",   # bugbear — likely bugs, not style
    "I",   # import sorting
    "UP",  # pyupgrade — syntax superseded by the minimum version
]
ignore = [
    # `datetime.UTC` is a 3.11+ alias for `timezone.utc`. Both are correct;
    # the explicit spelling reads better beside the tz-aware handling in
    # parse_feed_date, and rewriting every call site buys nothing.
    "UP017",
]
