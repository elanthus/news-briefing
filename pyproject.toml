# The project runs on Python 3.11+ from a checkout without installation. The
# package metadata below exists only to expose optional console scripts through
# an editable install (`pip install -e .`); the scripts call the same `main()`
# functions as `python3 -S <module>.py`. The modules read prompts, sources, and
# evaluator protocols relative to the checkout, so a non-editable install is not
# supported. No runtime dependency is declared: the static site renderer
# dependency is pinned separately in requirements-site.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-briefing"
version = "0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
news-briefing-fetch = "fetch_news:main"
news-briefing-run = "run_briefing:main"
news-briefing-daily = "run_daily_briefing:main"
news-briefing-eval = "eval_briefing:main"
news-briefing-publish = "daily_publish:main"
news-briefing-prepare-publication = "prepare_publication:main"
news-briefing-restore-corpora = "restore_private_corpora:main"
news-briefing-private-archive = "private_archive:main"
news-briefing-triage = "triage_run:main"
news-briefing-build-site = "build_site:main"
news-briefing-evaluator = "evaluator.__main__:main"

[tool.setuptools]
py-modules = [
    "audit_manifest",
    "briefing_config",
    "build_site",
    "corpus_schema",
    "daily_publish",
    "eval_briefing",
    "fetch_news",
    "prepare_publication",
    "private_archive",
    "publication_failures",
    "publication_schema",
    "restore_private_corpora",
    "run_briefing",
    "run_daily_briefing",
    "triage_run",
]
packages = ["agent_runner", "evaluator", "news_fetch", "news_fetch.sources"]

[tool.mypy]
python_version = "3.11"
# The modules listed in `files` (the dependency-free pipeline and runner, plus
# the site builder) are fully annotated and checked. The isolated evaluator has its own pyproject.toml.
# The test modules are not: annotating assertions adds noise without catching
# anything the tests themselves wouldn't.
files = [
    "briefing_config.py",
    "fetch_news.py",
    "news_fetch",
    "eval_briefing.py",
    "corpus_schema.py",
    "run_briefing.py",
    "run_daily_briefing.py",
    "daily_publish.py",
    "triage_run.py",
    "prepare_publication.py",
    "publication_schema.py",
    "publication_failures.py",
    "private_archive.py",
    "restore_private_corpora.py",
    "audit_manifest.py",
    "build_site.py",
    "agent_runner",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — unused imports and names
    "W",   # pycodestyle warnings
    "B",   # bugbear — likely bugs, not style
    "I",   # import sorting
    "UP",  # pyupgrade — syntax superseded by the minimum version
]
ignore = [
    # `datetime.UTC` is a 3.11+ alias for `timezone.utc`. The explicit spelling
    # matches the timezone-aware handling in parse_feed_date.
    "UP017",
]
