# Tool configuration only. The project runs on Python 3.11+ and has no
# package, build system, or third-party runtime dependencies.

[tool.mypy]
python_version = "3.11"
# The four modules that make up the dependency-free pipeline are fully
# annotated and checked. The isolated evaluator has its own pyproject.toml.
# The test modules are not: annotating assertions adds noise without catching
# anything the tests themselves wouldn't.
files = ["briefing_config.py", "fetch_news.py", "eval_briefing.py", "corpus_schema.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — unused imports and names
    "W",   # pycodestyle warnings
    "B",   # bugbear — likely bugs, not style
    "I",   # import sorting
    "UP",  # pyupgrade — syntax superseded by the minimum version
]
ignore = [
    # `datetime.UTC` is a 3.11+ alias for `timezone.utc`. Both are correct;
    # the explicit spelling reads better beside the tz-aware handling in
    # parse_feed_date, and rewriting every call site buys nothing.
    "UP017",
]
